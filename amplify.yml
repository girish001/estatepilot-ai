version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - npm -v
            - rm -rf node_modules ../../node_modules
            - npm ci --workspaces=false --include=dev --no-audit --no-fund
        build:
          commands:
            - npm run typecheck
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ~/.npm/**/*
