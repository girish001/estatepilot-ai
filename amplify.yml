version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || (nvm install 20 && nvm use 20) || true
            - node -v
            - npm -v
            - (cd ../.. && npm ci --include=dev --no-audit --no-fund)
            - npm ci --workspaces=false --include=dev --no-audit --no-fund
        build:
          commands:
            - npm run typecheck
            - npm run lint
            - npm run build
            - test -f .next/required-server-files.json
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ~/.npm/**/*
