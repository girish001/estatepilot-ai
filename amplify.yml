version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - node -v
            - npm -v
            - npm ci --include=dev --no-audit --no-fund || (rm -rf node_modules ../../node_modules && npm install --include=dev --no-audit --no-fund)
        build:
          commands:
            - npm run typecheck
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ~/.npm/**/*
